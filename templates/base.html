<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telegram Scraper</title>
  <style>
    :root {
      --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3e;
      --accent: #5b6af0; --accent2: #7c3aed;
      --text: #e2e8f0; --muted: #64748b; --green: #22c55e;
      --red: #ef4444; --yellow: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; }
    nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; gap: 24px; height: 52px; }
    nav .logo { font-weight: 700; font-size: 16px; color: var(--accent); letter-spacing: -0.5px; }
    nav a { color: var(--muted); text-decoration: none; font-size: 13px; }
    nav a:hover { color: var(--text); }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    .card h3 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; text-align: center; }
    .stat .val { font-size: 28px; font-weight: 700; color: var(--accent); }
    .stat .lbl { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: uppercase; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(91,106,240,0.05); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
    .badge-done { background: rgba(34,197,94,0.15); color: var(--green); }
    .badge-pending { background: rgba(245,158,11,0.15); color: var(--yellow); }
    .badge-scraping { background: rgba(91,106,240,0.2); color: var(--accent); }
    .badge-error { background: rgba(239,68,68,0.15); color: var(--red); }
    .badge-running { background: rgba(91,106,240,0.2); color: var(--accent); }
    .badge-stopped { background: rgba(100,116,139,0.2); color: var(--muted); }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: none; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-ghost { background: var(--border); color: var(--text); }
    input[type=text] { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 14px; outline: none; }
    input[type=text]:focus { border-color: var(--accent); }
    .log-box { background: #0a0c12; border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-family: monospace; font-size: 12px; color: #94a3b8; max-height: 320px; overflow-y: auto; white-space: pre-wrap; }
    .flex { display: flex; align-items: center; gap: 12px; }
    .flex-between { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; }
    h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
    .depth-badge { background: rgba(124,58,237,0.15); color: #a78bfa; border-radius: 99px; padding: 2px 8px; font-size: 11px; }
  </style>
</head>
<body>
<nav>
  <span class="logo">⚡ TG Scraper</span>
  <a href="/">Dashboard</a>
  <a href="/groups">Groupes</a>
  <a href="/members">Membres</a>
  <a href="/categories">Catégories</a>
  <a href="/lookup">Lookup user</a>
  <a href="/export/groups">Export groupes</a>
  <a href="/export/members">Export membres</a>
</nav>
<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
